# Create from the repository root: conda env create -f environment.yml
name: lec2026-ai
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip

  # Jupyter interface, kernel, and interactive notebook controls.
  - "jupyterlab>=4,<5"
  - "ipykernel>=6,<8"
  - "ipython>=8,<10"
  - "ipywidgets>=8,<9"
  - "jupyterlab_widgets>=3,<4"

  # All three scientific notebooks; aligned with requirements-core.txt.
  - "numpy>=1.24,<3"
  - "pandas>=1.5,<4"
  - "matplotlib>=3.7,<4"
  - "scipy>=1.10,<2"
  - "scikit-image>=0.22,<0.27"
  - "requests>=2.31,<3"

  # Included notebook authoring and optional execution utilities.
  - "nbformat>=5,<6"
  - "nbclient>=0.10,<1"
  - "jupyter_client>=8,<9"

  # Hugging Face notebook; aligned with requirements-huggingface.txt.
  # Conda installs the packages above before installing this pip section.
  - pip:
      - "transformers>=4.45,<5"
      - "torch>=2.2,<3"
      - "huggingface-hub>=0.25,<1"
      - "gradio-client>=1.3,<3"

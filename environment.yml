# From the repository root: conda env create -f environment.yml
name: lec2026-ai
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - "jupyterlab>=4,<5"
  - "ipykernel>=6,<8"
  - "ipython>=8,<10"
  - "ipywidgets>=8,<9"
  - "jupyterlab_widgets>=3,<4"
  - "numpy>=1.24,<3"
  - "pandas>=1.5,<4"
  - "matplotlib>=3.7,<4"
  - "scipy>=1.10,<2"
  - "scikit-image>=0.22,<0.27"
  - "requests>=2.31,<3"
